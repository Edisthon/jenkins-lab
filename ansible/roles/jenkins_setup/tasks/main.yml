---
- name: Pull and run Jenkins Docker Container
  ansible.builtin.command: >
    docker run -d
    -u root
    --name jenkins
    --restart=on-failure
    -p 8080:8080
    -p 50000:50000
    -v jenkins_home:/var/jenkins_home
    -v /var/run/docker.sock:/var/run/docker.sock
    -v /usr/bin/docker:/usr/bin/docker
    jenkins/jenkins:lts
  failed_when: false
  changed_when: false
