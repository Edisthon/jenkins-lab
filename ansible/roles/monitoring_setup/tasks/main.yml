---
- name: Create monitoring directory
  file:
    path: /home/ec2-user/monitoring
    state: directory
    owner: ec2-user
    group: ec2-user

- name: Copy docker-compose file
  copy:
    src: docker-compose.yml
    dest: /home/ec2-user/monitoring/docker-compose.yml
    owner: ec2-user
    group: ec2-user
  notify: Restart Monitoring

- name: Generate prometheus config from template
  template:
    src: prometheus.yml.j2
    dest: /home/ec2-user/monitoring/prometheus.yml
    owner: ec2-user
    group: ec2-user
  notify: Restart Monitoring
